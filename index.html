<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello from Claude</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #1f2937;
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 40%, #fbc2eb 100%);
      background-attachment: fixed;
      position: relative;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      z-index: 0;
    }

    body::before {
      width: 420px;
      height: 420px;
      background: #f0abfc;
      top: -120px;
      left: -120px;
    }

    body::after {
      width: 480px;
      height: 480px;
      background: #93c5fd;
      bottom: -160px;
      right: -160px;
    }

    .card {
      position: relative;
      z-index: 1;
      max-width: 520px;
      width: 100%;
      padding: 3rem 2.5rem;
      text-align: center;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      box-shadow:
        0 20px 60px -20px rgba(31, 41, 55, 0.25),
        0 8px 24px -8px rgba(31, 41, 55, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.85rem;
      margin-bottom: 1.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #4338ca;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 999px;
    }

    .badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.7; }
    }

    h1 {
      font-size: clamp(1.75rem, 4vw + 0.5rem, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.15;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #4f46e5 0%, #ec4899 60%, #f97316 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #4b5563;
      margin-bottom: 2rem;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    }

    .btn-primary {
      color: #ffffff;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      box-shadow: 0 10px 24px -8px rgba(99, 102, 241, 0.55);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px -8px rgba(236, 72, 153, 0.55);
    }

    .btn-secondary {
      color: #374151;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(17, 24, 39, 0.1);
    }

    .btn-secondary:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 1);
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <span class="badge">
      <span class="dot" aria-hidden="true"></span>
      Live in the sandbox
    </span>
    <h1>Hello from Claude in a sandbox!</h1>
    <p>
      A tiny, polished landing page rendered from a single HTML file —
      crafted with modern CSS, soft gradients, and a touch of glassmorphism.
    </p>
    <div class="actions">
      <a class="btn btn-primary" href="#">Get started</a>
      <a class="btn btn-secondary" href="#">Learn more</a>
    </div>
    <footer>Built with ❤ on 2026-05-27</footer>
  </main>
</body>
</html>
